<main id="admin-login-view" class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">

        <!-- Logo/Título -->
        <div class="text-center mb-5">
          <h2 class="fw-bold mb-2">⚙️ Panel Admin</h2>
          <p class="text-muted">Ingresa tus credenciales</p>
        </div>

        <!-- Formulario -->
        <form id="admin-login-form" class="card shadow-sm">
          <div class="card-body p-4">

            <div class="mb-3">
              <label class="form-label">Usuario</label>
              <input 
                type="text" 
                class="form-control form-control-lg" 
                id="admin-username"
                placeholder="Tu usuario"
                required>
            </div>

            <div class="mb-4">
              <label class="form-label">Contraseña</label>
              <input 
                type="password" 
                class="form-control form-control-lg" 
                id="admin-password"
                placeholder="Tu contraseña"
                required>
            </div>

            <!-- Mensaje de error -->
            <div id="login-error" class="alert alert-danger d-none mb-3"></div>

            <!-- Botones -->
            <button type="submit" class="btn btn-primary btn-lg w-100 mb-2">
              Iniciar sesión
            </button>
            <button type="button" class="btn btn-outline-secondary btn-lg w-100" id="cancel-login-btn">
              Volver
            </button>

          </div>
        </form>

        <p class="text-muted text-center mt-4 small">
          ¿Olvidaste tu contraseña? Contacta con soporte.
        </p>

      </div>
    </div>
  </div>
</main>
