<header id="site-header">
  <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top shadow-sm">
    <div class="container-fluid px-3 px-md-4">
      
      <!-- Logo/Brand -->
      <a class="navbar-brand fw-bold fs-5" href="#/" id="navbar-brand">
        joelBazar
      </a>

      <!-- Carrito + Hamburguesa -->
      <div class="d-flex gap-2 ms-auto">
        <!-- Botón carrito con badge -->
        <button 
          class="btn btn-outline-primary position-relative" 
          id="cart-toggle-btn"
          data-bs-toggle="offcanvas" 
          data-bs-target="#cartOffcanvas">
          🛒
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
                id="cart-count">
            0
          </span>
        </button>

        <!-- Botón admin (solo visible después de login) -->
        <button 
          class="btn btn-outline-secondary d-none" 
          id="admin-toggle-btn"
          style="display: none;">
          ⚙️ Admin
        </button>

        <!-- Hamburguesa -->
        <button 
          class="navbar-toggler" 
          type="button" 
          data-bs-toggle="collapse" 
          data-bs-target="#navbarContent">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>

      <!-- Menú colapsable -->
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="#/" id="nav-home">Home</a>
          </li>
          <li class="nav-item">
            <button class="nav-link btn btn-link" id="nav-login">
              Iniciar sesión (Admin)
            </button>
          </li>
        </ul>
      </div>

    </div>
  </nav>
</header>

<!-- Offcanvas Carrito -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title">Tu Carrito</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body d-flex flex-column">
    <!-- Items del carrito se renderizarán aquí -->
    <div id="cart-items-container">
      <p class="text-muted text-center">Tu carrito está vacío</p>
    </div>

    <!-- Resumen y botones de acción -->
    <div class="mt-auto pt-3 border-top">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <strong>Total:</strong>
        <span class="fs-5 fw-bold text-success" id="cart-total">$0</span>
      </div>
      
      <button 
        class="btn btn-primary w-100 mb-2" 
        id="checkout-btn"
        disabled>
        Ir al pago
      </button>
      
      <button 
        class="btn btn-outline-danger w-100" 
        id="clear-cart-btn">
        Vaciar carrito
      </button>
    </div>
  </div>
</div>
