<div class="col-12 col-sm-6 col-lg-4">
  <div class="card h-100 shadow-sm product-card" data-product-id="">
    
    <!-- Imagen -->
    <img 
      src="" 
      class="card-img-top bg-light object-fit-cover" 
      alt="" 
      style="height: 220px; object-fit: contain;">
    
    <div class="card-body d-flex flex-column">
      
      <!-- Nombre -->
      <h5 class="card-title mb-2"></h5>
      
      <!-- Descripción corta -->
      <p class="card-text text-muted small mb-3"></p>
      
      <!-- Categoría (badge) -->
      <div class="mb-2">
        <span class="badge bg-secondary"></span>
      </div>

      <!-- Precio + Stock -->
      <div class="mb-3">
        <span class="fs-5 fw-bold text-success me-2">$0</span>
        <small class="text-muted" id="stock-info">Stock: 0</small>
      </div>

      <!-- Botones -->
      <div class="d-flex gap-2 mt-auto">
        <button 
          class="btn btn-outline-primary flex-grow-1 btn-view-detail"
           data-product-id="">
          Ver detalle
        </button>
        <button 
          class="btn btn-success btn-add-to-cart"
           data-product-id=""
           id="btn-add-cart">
          Agregar
        </button>
      </div>

    </div>
  </div>
</div>
