<main id="home-view" class="py-4">
  <div class="container">

    <!-- Banner/Intro -->
    <section class="text-center mb-5">
      <h1 class="display-5 fw-bold mb-2">Bienvenido a joelBazar</h1>
      <p class="lead text-muted mb-4">
        Descubre nuestros productos de calidad. Todo lo que necesitas en un solo lugar.
      </p>
    </section>

    <!-- Búsqueda -->
    <section class="mb-4">
      <form class="search-form d-flex gap-2" id="search-form">
        <input 
          type="text" 
          class="form-control form-control-lg" 
          placeholder="Buscar productos..." 
          id="search-input"
          autocomplete="off">
        <button class="btn btn-primary btn-lg" type="submit">
          🔍 Buscar
        </button>
      </form>
    </section>

    <!-- Filtros por categoría -->
    <section class="mb-5">
      <h5 class="mb-3">Categorías</h5>
      <div class="d-flex gap-2 flex-wrap" id="categories-container">
        <button class="btn btn-outline-primary active" data-category="all">
          Todas
        </button>
        <!-- Las categorías se cargarán dinámicamente aquí -->
      </div>
    </section>

    <!-- Grid de productos -->
    <section>
      <div class="row g-4" id="products-container">
        <!-- Los productos se renderizarán como skeleton loaders primero -->
        <!-- Luego se reemplazarán con datos reales -->
      </div>

      <!-- Mensaje cuando no hay productos -->
      <div id="no-products-message" class="text-center text-muted py-5" style="display: none;">
        <p class="fs-5">No encontramos productos que coincidan con tu búsqueda.</p>
      </div>
    </section>

  </div>
</main>
